<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="scripts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
    <title>Uno dos o tres</title>
</head>
<body>
    <select id = "partidas" class="form-select" aria-label="Default select example">
        <option value="Partidas">Partidas</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>

    <select id = "jugadores" class="form-select" aria-label="Default select example">
        <option value="Jugadores">Jugadores</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>
    <button type="button" class="btn btn-primary" onclick=jugar()>JUGAR</button>

    <div id="puntuaciones" style="display: none">
        <p id="puntuacion1">Puntuacion Jugador 1: 0</p>
        <p id="puntuacion2">Puntuacion Jugador 2: 0</p>
        <p id="puntuacion3">Puntuacion Jugador 3: 0</p>
    </div>
    
    <div id = "jugador1" style="display: none">
        <p>Jugador 1: </p>
        <input type="text" id="inputJugador1" placeholder="Elige 1 2 o 3">
    </div>

    <div id = "jugador2" style="display: none">
        <p>Jugador 2: </p>
        <input type="text" id="inputJugador2" placeholder="Elige 1 2 o 3">
    </div>

    <div id = "jugador3" style="display: none">
        <p>Jugador 3: </p>
        <input type="text" id="inputJugador3" placeholder="Elige 1 2 o 3">
    </div>
</body>
</html>
